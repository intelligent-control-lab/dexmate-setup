name: Validate setup kit
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install numpy==2.2.6
      - run: python -m compileall -q scripts software
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_site.py
      - run: cd drivers && sha256sum -c SHA256SUMS
      - run: python scripts/build_docs.py && git diff --exit-code -- docs/index.html docs/en.html
