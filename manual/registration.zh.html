<div class="note"><span class="tag">先获取本机名称与注册文件</span><p>请到 <a href="https://platform.dexmate.ai/">Dexmate 官方平台</a> 获取本机名称，并下载这台机器人对应的 <code>.dzcfg</code> 注册文件。将本机名称用于 <code>ROBOT_NAME</code> 和 installer 的 <code>--robot-name</code> 参数，并使用对应文件完成下方的注册／证书配置。手册中展示的机器人名称是我们这台机器的示例；安装新机器人时，请使用官网为该机提供的名称和文件。</p></div>
